name: Solidity tests
on:
    push:
        paths-ignore:
            - '**.md'
            - 'ipfs/**'
jobs:
    run-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v2
              with:
                  node-version: '22.23.4'
            - run: node --version
            - run: npm ci
              working-directory: contract
            - run: npx hardhat compile
              working-directory: contract
            - name: Verify the committed dependency lockfile
              run: |
                  git diff --exit-code -- contract/package-lock.json
                  sha256sum contract/package-lock.json
            - run: npm run test:ci
              working-directory: contract
